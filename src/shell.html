[hidden]{display:none!important}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  font-size:13px;color:var(--ink-soft);white-space:nowrap;transition:opacity .8s ease;pointer-events:none}
.hint.gone{opacity:0}
.credit{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--ink-soft);max-width:calc(100% - 32px);text-align:right}
