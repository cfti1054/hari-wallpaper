<!-- 3D 모델: "Chibi Kitten - dilute calico recolor (Hari)" by Cato Berg (https://sketchfab.com/catoberg13), CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
     원본: https://sketchfab.com/3d-models/chibi-kitten-with-bell-tripo-3d-vs-supavoxel-e75473f853184396ab630f4819b8350e
     변경 사항: 메시 단순화(약 150만 → 7만 삼각형), 텍스처 2048px JPEG, 탄젠트 제거, 자동 뼈대·눈꺼풀 추가
     마고·미코: 같은 작가의 "classic calico recolor"·"Chibi Kitten With Bell" 색 텍스처(1024px로 축소)를 하리 메시에 입힘, CC BY 4.0 -->
<style>
/* Layout: 흰 바탕 전체 화면 캔버스, 가운데 3D 캐릭터. 안내·출처 문구는 #wallpaper 로 열면 숨김. 의도적으로 흰 배경 단일 테마 */
:root{
  --paper:#ffffff;
  --ink:#4f5566;
  --ink-soft:rgba(79,85,102,.72);
  --chip:rgba(246,247,251,.94);
  --chip-line:rgba(40,55,90,.12);
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:calc(100% - 32px);padding:8px 16px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);
  font-size:13px;color:var(--ink-soft);white-space:nowrap;transition:opacity .8s ease;pointer-events:none}
.hint.gone{opacity:0}
.credit{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--ink-soft);max-width:calc(100% - 32px);text-align:right}
.credit a{color:inherit}
.err{position:fixed;inset:auto 16px 16px 16px;color:var(--ink);font-size:13px}

/* 편지: 네잎클로버를 하리에게 건네면 봉투가 열리고 편지지가 올라온다 */
.letter{--paper-l:#fffcf4;--ink-l:#4a4238;--leaf:#4f9a55;--env:#f6e2d3;--env-d:#efd2bf;--env-f:#fbece2;
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;
  background:rgba(255,253,248,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .5s ease}
.letter.show{opacity:1;pointer-events:auto}
.env{position:absolute;width:min(300px,78vw);aspect-ratio:3/2;perspective:800px;
  transform:translateY(40px) scale(.55) rotate(-6deg);opacity:0;transition:transform .7s cubic-bezier(.2,1.35,.4,1),opacity .4s ease}
.show .env{transform:none;opacity:1}
.env>*{position:absolute}
.env-back{inset:0;border-radius:10px;background:var(--env-d);box-shadow:0 18px 40px rgba(90,60,40,.16)}
.env-paper{left:7%;right:7%;top:8%;height:80%;border-radius:6px;background:var(--paper-l);
  background-image:repeating-linear-gradient(transparent 0 13px,rgba(79,154,85,.14) 13px 14px);background-position:0 24px;
  transition:transform .8s cubic-bezier(.3,.9,.3,1)}
.env-front{inset:0;border-radius:10px;background:var(--env-f);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  box-shadow:inset 0 -2px 0 rgba(150,100,70,.06)}
.env-flap{left:0;right:0;top:0;height:62%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;z-index:3;transition:transform .6s ease,z-index 0s .3s}
.env-seal{left:50%;top:62%;width:38px;height:38px;margin:-19px 0 0 -19px;z-index:4;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(90,60,40,.18);display:grid;place-items:center;transition:opacity .25s ease,transform .25s ease}
.env-seal svg{width:28px;height:28px}
.flap .env-flap{transform:rotateX(180deg);z-index:0}
.flap .env-seal{opacity:0;transform:scale(.6)}
.rise .env-paper{transform:translateY(-58%)}
.read .env{transform:translateY(55vh) scale(.9);opacity:0;transition:transform .7s ease-in,opacity .5s ease .15s}
.card{position:relative;width:min(440px,100%);max-height:min(80vh,640px);display:flex;flex-direction:column;
  padding:40px 32px 28px;border-radius:14px;background:var(--paper-l);color:var(--ink-l);
  box-shadow:0 24px 60px rgba(90,70,50,.18),0 2px 0 rgba(90,70,50,.04);
  font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  opacity:0;transform:translateY(60px) scale(.88);transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.2,.4,1)}
.read .card{opacity:1;transform:none;transition-delay:.25s}
.card-ico{flex:none;width:40px;height:40px;margin:0 auto 10px;display:block}
.l-to{flex:none;margin:0 0 14px;font-size:21px;font-weight:700;text-align:center;letter-spacing:.02em}
.l-body{flex:1 1 auto;min-height:64px;overflow:auto;font-size:16px;line-height:32px;padding:0 4px;
  background:repeating-linear-gradient(transparent 0 31px,rgba(79,154,85,.16) 31px 32px);background-attachment:local}
.l-body p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.l-body p:empty{height:32px}
.l-date,.l-from{margin:0;text-align:right;font-size:14px;line-height:28px;color:rgba(74,66,56,.75)}
.l-date{margin-top:14px}
.l-from{margin-top:4px;font-size:16px;color:var(--ink-l)}
.l-date:empty,.l-from:empty{display:none}
.l-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;
  color:rgba(74,66,56,.6);font:400 24px/1 var(--font-ui);cursor:pointer}
.l-close:hover{background:rgba(79,154,85,.1);color:var(--ink-l)}
.l-close:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
@media (max-width:420px){.card{padding:36px 20px 22px}}
@media (prefers-reduced-motion: reduce){.hint,.letter,.env,.card{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">

<div class="hint" id="hint">하리를 쓰다듬거나, 네잎클로버를 하리에게 가져다주세요</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="clover-ico" viewBox="-50 -50 100 100">
    <path d="M2 4 Q10 26 22 44" fill="none" stroke="#5f9e4f" stroke-width="5" stroke-linecap="round"/>
    <g fill="#5bb35d" transform="scale(.86)">
      <path id="clover-leaf" d="M0 0C-12-6-29-21-26-36C-23-50-5-51 0-40C5-51 23-50 26-36C29-21 12-6 0 0Z" transform="rotate(45)"/>
      <use href="#clover-leaf" transform="rotate(90)"/><use href="#clover-leaf" transform="rotate(180)"/><use href="#clover-leaf" transform="rotate(270)"/>
    </g>
    <circle r="4" fill="#3f8a45"/>
  </symbol>
</svg>

<div class="letter" id="letter" hidden role="dialog" aria-modal="true" aria-labelledby="letter-to">
  <div class="env" aria-hidden="true">
    <div class="env-back"></div><div class="env-paper"></div><div class="env-front"></div><div class="env-flap"></div>
    <div class="env-seal"><svg><use href="#clover-ico"/></svg></div>
  </div>
  <article class="card">
    <button class="l-close" type="button" aria-label="편지 닫기">×</button>
    <svg class="card-ico" aria-hidden="true"><use href="#clover-ico"/></svg>
    <h2 class="l-to" id="letter-to"></h2>
    <div class="l-body"></div>
    <p class="l-date"></p>
    <p class="l-from"></p>
  </article>
</div>
